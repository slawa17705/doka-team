<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <link rel="canonical" href="https://doka-team.ru">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Оставить отзыв о Дока-Тим — DOKA-TEAM</title>
    <style>
        :root {
            --accent: #d4af37;
            --glass: rgba(255, 255, 255, 0.06);
            --text: #fff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: url('image/ice-crystals-fon1.webp') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            line-height: 1.7;
            color: var(--text);
        }

        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            background: url('image/glass-bg1.webp') no-repeat center center;
            background-size: cover;
            padding: 45px 40px;
            border-radius: 14px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .gold-line {
            width: 60px;
            height: 3px;
            background: var(--accent);
            margin: 0 auto 25px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--text);
            opacity: 0.85;
            margin-bottom: 25px;
        }

        .review-form input,
        .review-form select,
        .review-form textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            resize: vertical;
        }

        .review-form select option {
            background: #222;
            color: #fff;
        }

        .review-form input::placeholder,
        .review-form textarea::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        .review-form input:focus,
        .review-form select:focus,
        .review-form textarea:focus {
            border-color: var(--accent);
        }

        .address-box {
            position: relative;
            margin-bottom: 15px;
        }

        .address-box input {
            margin-bottom: 0;
        }

        .suggestions-list {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1a1e24;
            border: 1px solid var(--accent);
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
        }

        .suggestions-item {
            padding: 10px 14px;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            line-height: 1.4;
        }

        .suggestions-item:last-child {
            border-bottom: none;
        }

        .suggestions-item:hover {
            background: rgba(212, 175, 55, 0.25);
        }

        .btn-submit {
            display: block;
            width: 100%;
            background-color: var(--accent);
            color: #111;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: all 0.3s;
        }

        .btn-submit:hover {
            background-color: #e5c158;
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Оставить отзыв</h1>
        <div class="gold-line"></div>
        <p class="subtitle">Укажите реальный адрес объекта (для проверки выполнения работ) — на сайте он публиковаться
            не будет.</p>

        <form class="review-form" id="review-form">
            <input type="text" name="name" placeholder="Ваше имя (например: Иван)" required>

            <div class="address-box">
                <input type="text" id="addressInput" name="address"
                    placeholder="Начните вводить адрес объекта (город, улица, дом, кв.)" autocomplete="off" required>
                <div class="suggestions-list" id="suggestionsList"></div>
            </div>

            <input type="text" name="_gotcha" style="display:none !important;" tabindex="-1" autocomplete="off">

            <select name="rating" required>
                <option value="5">⭐️⭐️⭐️⭐️⭐️ — Отлично (5 из 5)</option>
                <option value="4">⭐️⭐️⭐️⭐️ — Хорошо (4 из 5)</option>
                <option value="3">⭐️⭐️⭐️ — Нормально (3 из 5)</option>
                <option value="2">⭐️⭐️ — Плохо (2 из 5)</option>
                <option value="1">⭐️ — Ужасно (1 из 5)</option>
            </select>
            <textarea name="review" placeholder="Расскажите, какие работы мы выполняли и всё ли понравилось..." rows="4"
                minlength="15" required></textarea>
            <button type="submit" class="btn-submit">Отправить отзыв</button>
        </form>

        <a href="reviews.html" class="back-link">← Вернуться к отзывам</a>
    </div>

    <script>
        const DADATA_TOKEN = "1b689d9bd155dcd78bda8e259f1efadaaa8b172e";
        const addressInput = document.getElementById('addressInput');
        const suggestionsList = document.getElementById('suggestionsList');
        let isRealAddressSelected = false;
        let debounceTimer;

        addressInput.addEventListener('input', function () {
            isRealAddressSelected = false;
            const query = this.value.trim();
            clearTimeout(debounceTimer);

            if (query.length < 3) {
                suggestionsList.style.display = 'none';
                return;
            }

            debounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch("https://dadata.ru", {
                        method: "POST",
                        mode: "cors",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json",
                            "Authorization": "Token " + DADATA_TOKEN
                        },
                        body: JSON.stringify({ query: query, count: 6 })
                    });

                    const data = await res.json();
                    suggestionsList.innerHTML = '';

                    if (data.suggestions && data.suggestions.length > 0) {
                        data.suggestions.forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'suggestions-item';
                            div.textContent = item.value;
                            div.addEventListener('click', () => {
                                addressInput.value = item.value;
                                suggestionsList.style.display = 'none';
                                if (item.data && item.data.house) {
                                    isRealAddressSelected = true;
                                } else {
                                    isRealAddressSelected = false;
                                    alert("Пожалуйста, уточните адрес до номера дома (и квартиры, если это многоквартирный дом).");
                                }
                            });
                            suggestionsList.appendChild(div);
                        });
                        suggestionsList.style.display = 'block';
                    } else {
                        suggestionsList.style.display = 'none';
                    }
                } catch (err) {
                    console.error('Ошибка подсказок DaData:', err);
                }
            }, 300);
        });

        document.addEventListener('click', function (e) {
            if (!e.target.closest('.address-box')) {
                suggestionsList.style.display = 'none';
            }
        });

        const form = document.getElementById('review-form');
        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            if (form.querySelector('input[name="_gotcha"]').value) return;

            if (!isRealAddressSelected) {
                alert('Пожалуйста, выберите существующий адрес объекта (до дома или квартиры) из выпадающего списка подсказок.');
                addressInput.focus();
                return;
            }

            const name = form.querySelector('input[name="name"]').value.trim();
            const address = addressInput.value.trim();
            const rating = form.querySelector('select[name="rating"]').value;
            const reviewText = form.querySelector('textarea[name="review"]').value.trim();

            const btn = form.querySelector('.btn-submit');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '⏳ Отправляю...';

            const formData = new FormData();
            formData.append('name', name);
            formData.append('address', address);
            formData.append('rating', rating + ' из 5');
            formData.append('review', `📝 Новый отзыв с сайта Дока-Тим!\nАвтор: ${name}\nАдрес объекта: ${address}\nОценка: ${rating} из 5\n\nОтзыв:\n${reviewText}`);

            try {
                const response = await fetch('https://formspree.io', {
                    method: 'POST',
                    headers: { 'Accept': 'application/json' },
                    body: formData
                });

                if (response.ok) {
                    form.reset();
                    isRealAddressSelected = false;
                    alert('Спасибо! Ваш отзыв отправлен на проверку.');
                } else {
                    alert('Не удалось отправить отзыв. Попробуйте ещё раз.');
                }
            } catch (error) {
                alert('Ошибка сети. Проверьте подключение к интернету.');
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        });
    </script>
</body>

</html>
