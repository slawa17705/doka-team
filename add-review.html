<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <link rel="canonical" href="https://doka-team.ru">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Оставить отзыв о Дока-Тим — DOKA-TEAM</title>
    <style>
        :root {
            --accent: #d4af37;
            --glass: rgba(255, 255, 255, 0.06);
            --text: #fff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: url('image/ice-crystals-fon1.webp') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            line-height: 1.7;
            color: var(--text);
        }

        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            background: url('image/glass-bg1.webp') no-repeat center center;
            background-size: cover;
            padding: 45px 40px;
            border-radius: 14px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .gold-line {
            width: 60px;
            height: 3px;
            background: var(--accent);
            margin: 0 auto 25px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--text);
            opacity: 0.85;
            margin-bottom: 25px;
        }

        .review-form input,
        .review-form select,
        .review-form textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            resize: vertical;
        }

        .review-form select option {
            background: #222;
            color: #fff;
        }

        .review-form input::placeholder,
        .review-form textarea::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        .review-form input:focus,
        .review-form select:focus,
        .review-form textarea:focus {
            border-color: var(--accent);
        }

        .address-box {
            position: relative;
            margin-bottom: 15px;
        }

        .address-box input {
            margin-bottom: 0;
        }

        .suggestions-list {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1a1e24;
            border: 1px solid var(--accent);
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
        }

        .suggestions-item {
            padding: 10px 14px;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            line-height: 1.4;
        }

        .suggestions-item:last-child {
            border-bottom: none;
        }

        .suggestions-item:hover {
            background: rgba(212, 175, 55, 0.25);
        }

        .btn-submit {
            display: block;
            width: 100%;
            background-color: var(--accent);
            color: #111;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: all 0.3s;
        }

        .btn-submit:hover {
            background-color: #e5c158;
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Оставить отзыв</h1>
        <div class="gold-line"></div>
        <p class="subtitle">Укажите реальный адрес объекта (для проверки выполнения работ) — на сайте он публиковаться
            не будет.</p>

        <form class="review-form" id="review-form">
            <input type="text" name="name" placeholder="Ваше имя (например: Иван)" required>

            <input type="text" id="addressInput" name="address"
                placeholder="Укажите адрес объекта (город, улица, дом, кв.)" autocomplete="street-address" required>

            <input type="text" name="_gotcha" style="display:none !important;" tabindex="-1" autocomplete="off">

            <select name="rating" required>
                <option value="5">⭐️⭐️⭐️⭐️⭐️ — Отлично (5 из 5)</option>
                <option value="4">⭐️⭐️⭐️⭐️ — Хорошо (4 из 5)</option>
                <option value="3">⭐️⭐️⭐️ — Нормально (3 из 5)</option>
                <option value="2">⭐️⭐️ — Плохо (2 из 5)</option>
                <option value="1">⭐️ — Ужасно (1 из 5)</option>
            </select>
            <textarea name="review" placeholder="Расскажите, какие работы мы выполняли и всё ли понравилось..." rows="4"
                minlength="15" required></textarea>
            <button type="submit" class="btn-submit">Отправить отзыв</button>
        </form>

                <div style="display: flex; justify-content: center; gap: 25px; margin-top: 25px; flex-wrap: wrap;">
            <a href="reviews.html" class="back-link" style="margin-top: 0;">← К отзывам</a>
            <a href="index.html" class="back-link" style="margin-top: 0;">🏠 На главную</a>
        </div>

    </div>

             <script>
        const addressInput = document.getElementById('addressInput');
        const cityDropdown = document.getElementById('cityDropdown');
        const form = document.getElementById('review-form');

        const popularLocations = [
            "г. Москва, ул. ",
            "г. Москва, Зеленоград, корп. ",
            "Московская обл., г. Химки, ул. ",
            "Московская обл., г. Солнечногорск, ул. ",
            "Московская обл., г. Клин, ул. ",
            "Московская обл., д. Большое Щапово, д. ",
            "Московская обл., г. Красногорск, ул. ",
            "Московская обл., г. Одинцово, ул. ",
            "Московская обл., г. Мытищи, ул. ",
            "Московская обл., г. Долгопрудный, ул. ",
            "Московская обл., г. Лобня, ул. ",
            "Московская обл., г. Истра, ул. ",
            "Московская обл., г. Балашиха, ул. ",
            "Московская обл., г. Подольск, ул. ",
            "Московская обл., г. Люберцы, ул. ",
            "Московская обл., г. Королёв, ул. ",
            "Московская обл., г. Пушкино, ул. ",
            "Московская обл., г. Щёлково, ул. ",
            "Московская обл., г. Раменское, ул. ",
            "Московская обл., г. Домодедово, ул. ",
            "г. Санкт-Петербург, ул. ",
            "г. Дербент, ул. ",
            "г. Махачкала, ул. ",
            "г. Каспийск, ул. ",
            "г. Хасавюрт, ул. ",
            "г. Новосибирск, ул. ",
            "г. Екатеринбург, ул. ",
            "г. Казань, ул. ",
            "г. Нижний Новгород, ул. ",
            "г. Челябинск, ул. ",
            "г. Красноярск, ул. ",
            "г. Самара, ул. ",
            "г. Уфа, ул. ",
            "г. Ростов-на-Дону, ул. ",
            "г. Омск, ул. ",
            "г. Краснодар, ул. ",
            "г. Воронеж, ул. ",
            "г. Пермь, ул. ",
            "г. Волгоград, ул. ",
            "г. Саратов, ул. ",
            "г. Тюмень, ул. ",
            "г. Тольятти, ул. ",
            "г. Ижевск, ул. ",
            "г. Барнаул, ул. ",
            "г. Ульяновск, ул. ",
            "г. Иркутск, ул. ",
            "г. Хабаровск, ул. ",
            "г. Ярославль, ул. ",
            "г. Владивосток, ул. ",
            "г. Томск, ул. ",
            "г. Оренбург, ул. ",
            "г. Кемерово, ул. ",
            "г. Новокузнецк, ул. ",
            "г. Рязань, ул. ",
            "г. Набережные Челны, ул. ",
            "г. Астрахань, ул. ",
            "г. Пенза, ул. ",
            "г. Киров, ул. ",
            "г. Липецк, ул. ",
            "г. Чебоксары, ул. ",
            "г. Калининград, ул. ",
            "г. Тула, ул. ",
            "г. Курск, ул. ",
            "г. Ставрополь, ул. ",
            "г. Сочи, ул. ",
            "г. Тверь, ул. ",
            "г. Иваново, ул. ",
            "г. Брянск, ул. ",
            "г. Белгород, ул. ",
            "г. Сургут, ул. ",
            "г. Владимир, ул. ",
            "г. Архангельск, ул. ",
            "г. Калуга, ул. ",
            "г. Смоленск, ул. ",
            "г. Саранск, ул. ",
            "г. Череповец, ул. ",
            "г. Вологда, ул. ",
            "г. Орёл, ул. ",
            "г. Владикавказ, ул. ",
            "г. Грозный, ул. ",
            "г. Нальчик, ул. ",
            "г. Мурманск, ул. ",
            "г. Тамбов, ул. ",
            "г. Петрозаводск, ул. ",
            "г. Кострома, ул. ",
            "г. Новороссийск, ул. ",
            "г. Севастополь, ул. ",
            "г. Симферополь, ул. "
        ];

        addressInput.addEventListener('input', function () {
            const val = this.value.trim().toLowerCase();
            cityDropdown.innerHTML = '';

            if (val.length < 2) {
                cityDropdown.style.display = 'none';
                return;
            }

            const matches = popularLocations.filter(loc => loc.toLowerCase().includes(val));

            if (matches.length > 0) {
                matches.forEach(match => {
                    const item = document.createElement('div');
                    item.textContent = match;
                    item.style.padding = '10px 14px';
                    item.style.fontSize = '14px';
                    item.style.color = '#fff';
                    item.style.cursor = 'pointer';
                    item.style.borderBottom = '1px solid rgba(255,255,255,0.08)';
                    item.onmouseenter = () => item.style.background = 'rgba(212, 175, 55, 0.25)';
                    item.onmouseleave = () => item.style.background = 'transparent';
                    item.onclick = () => {
                        addressInput.value = match;
                        cityDropdown.style.display = 'none';
                        addressInput.focus();
                    };
                    cityDropdown.appendChild(item);
                });
                cityDropdown.style.display = 'block';
            } else {
                cityDropdown.style.display = 'none';
            }
        });

        document.addEventListener('click', function (e) {
            if (e.target !== addressInput && !cityDropdown.contains(e.target)) {
                cityDropdown.style.display = 'none';
            }
        });

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            if (form.querySelector('input[name="_gotcha"]').value) return;

            const name = form.querySelector('input[name="name"]').value.trim();
            const address = addressInput.value.trim();
            const rating = form.querySelector('select[name="rating"]').value;
            const reviewText = form.querySelector('textarea[name="review"]').value.trim();

            const hasLetters = /[а-яА-ЯёЁa-zA-Z]{3,}/.test(address);
            const hasNumbers = /\d+/.test(address);

            if (!hasLetters || !hasNumbers || address.length < 8) {
                alert('Пожалуйста, укажите адрес объекта (населённый пункт, улицу и номер дома), чтобы мы могли подтвердить выполнение работ.');
                addressInput.focus();
                return;
            }

            const btn = form.querySelector('.btn-submit');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '⏳ Отправляю...';

            const formData = new FormData();
            formData.append('name', name);
            formData.append('address', address);
            formData.append('rating', rating + ' из 5');
            formData.append('review', `📝 Новый отзыв с сайта Дока-Тим!\nАвтор: ${name}\nАдрес объекта: ${address}\nОценка: ${rating} из 5\n\nОтзыв:\n${reviewText}`);

            try {
                const endpoint = 'https://formspree.io' + '/f/xlgyyjnj';
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json' },
                    body: formData
                });

                if (response.ok) {
                    form.reset();
                    alert('Спасибо! Ваш отзыв успешно отправлен на проверку.');
                } else {
                    alert('Не удалось отправить отзыв. Попробуйте ещё раз.');
                }
            } catch (error) {
                alert('Ошибка сети. Проверьте подключение к интернету.');
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        });
    </script>


</body>


</html>
