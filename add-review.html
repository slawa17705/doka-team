<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <link rel="canonical" href="https://doka-team.ru">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Оставить отзыв о Дока-Тим — DOKA-TEAM</title>
    <link href="https://jsdelivr.net" rel="stylesheet" />
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/suggestions-jquery@22.6.0/dist/css/suggestions.min.css">
    <style>
        :root {
            --accent: #d4af37;
            --text: #fff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: url('image/ice-crystals-fon1.webp') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            line-height: 1.7;
            color: var(--text);
        }

        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            background: url('image/glass-bg1.webp') no-repeat center center;
            background-size: cover;
            padding: 45px 40px;
            border-radius: 14px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .gold-line {
            width: 60px;
            height: 3px;
            background: var(--accent);
            margin: 0 auto 25px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--text);
            opacity: 0.85;
            margin-bottom: 25px;
        }

        .review-form input,
        .review-form select,
        .review-form textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            resize: vertical;
        }

        .review-form select option {
            background: #222;
            color: #fff;
        }

        .review-form input::placeholder,
        .review-form textarea::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        .review-form input:focus,
        .review-form select:focus,
        .review-form textarea:focus {
            border-color: var(--accent);
        }

        .suggestions-wrapper {
            margin-bottom: 15px;
        }

        .suggestions-wrapper input {
            margin-bottom: 0;
        }

        .suggestions-suggestions {
            background: #1a1e24 !important;
            border: 1px solid var(--accent) !important;
            color: #fff !important;
            border-radius: 0 0 6px 6px !important;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8) !important;
        }

        .suggestions-suggestion {
            color: #fff !important;
            padding: 10px 14px !important;
            font-size: 14px !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
        }

        .suggestions-suggestion:hover,
        .suggestions-selected {
            background: rgba(212, 175, 55, 0.25) !important;
        }

        .suggestions-value strong {
            color: var(--accent) !important;
            font-weight: 700 !important;
        }

        .suggestions-promo {
            display: none !important;
        }

        .btn-submit {
            display: block;
            width: 100%;
            background-color: var(--accent);
            color: #111;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: all 0.3s;
        }

        .btn-submit:hover {
            background-color: #e5c158;
            transform: translateY(-2px);
        }

        .links-row {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .back-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Оставить отзыв</h1>
        <div class="gold-line"></div>
        <p class="subtitle">Укажите реальный адрес объекта (для проверки выполнения работ) — на сайте он публиковаться не будет.</p>

        <form class="review-form" id="review-form">
            <input type="text" name="name" placeholder="Ваше имя (например: Иван)" required>

            <input type="text" id="addressInput" name="address" placeholder="Начните вводить город, улицу, дом..." required>

            <input type="text" name="_gotcha" style="display:none !important;" tabindex="-1" autocomplete="off">

            <select name="rating" required>
                <option value="5">⭐️⭐️⭐️⭐️⭐️ — Отлично (5 из 5)</option>
                <option value="4">⭐️⭐️⭐️⭐️ — Хорошо (4 из 5)</option>
                <option value="3">⭐️⭐️⭐️ — Нормально (3 из 5)</option>
                <option value="2">⭐️⭐️ — Плохо (2 из 5)</option>
                <option value="1">⭐️ — Ужасно (1 из 5)</option>
            </select>
            <textarea name="review" placeholder="Расскажите, какие работы мы выполняли и всё ли понравилось..." rows="4" minlength="15" required></textarea>
            <button type="submit" class="btn-submit">Отправить отзыв</button>
        </form>

        <div class="links-row">
            <a href="reviews.html" class="back-link">← К отзывам</a>
            <a href="index.html" class="back-link">🏠 На главную</a>
        </div>
    </div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/suggestions-jquery@22.6.0/dist/js/jquery.suggestions.min.js"></script>
   <script>
        let isDaDataSelected = false;
        let isDaDataLoaded = false;

        if (window.jQuery && $.fn.suggestions) {
            isDaDataLoaded = true;
            $("#addressInput").suggestions({
                token: "1b689d9bd155dcd78bda8e259f1efadaaa8b172e",
                type: "ADDRESS",
                onSelect: function (suggestion) {
                    if (suggestion.data && suggestion.data.house) {
                        isDaDataSelected = true;
                    } else {
                        isDaDataSelected = false;
                        alert("Пожалуйста, выберите адрес до номера дома (и квартиры, если это многоквартирный дом).");
                    }
                }
            });

            $("#addressInput").on("input", function () {
                isDaDataSelected = false;
            });
        }

        const form = document.getElementById('review-form');
        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            if (form.querySelector('input[name="_gotcha"]').value) return;

            const name = form.querySelector('input[name="name"]').value.trim();
            const address = document.getElementById('addressInput').value.trim();
            const rating = form.querySelector('select[name="rating"]').value;
            const reviewText = form.querySelector('textarea[name="review"]').value.trim();

            if (isDaDataLoaded) {
                if (!isDaDataSelected) {
                    alert('Пожалуйста, выберите существующий адрес объекта (до дома или квартиры) из выпадающего списка подсказок.');
                    document.getElementById('addressInput').focus();
                    return;
                }
            } else {
                const hasLetters = /[а-яА-ЯёЁa-zA-Z]{3,}/.test(address);
                const hasNumbers = /\d+/.test(address);
                if (!hasLetters || !hasNumbers || address.length < 8) {
                    alert('Пожалуйста, укажите адрес объекта (населённый пункт, улицу и номер дома).');
                    document.getElementById('addressInput').focus();
                    return;
                }
            }

            const btn = form.querySelector('.btn-submit');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '⏳ Отправляю...';

            const formData = new FormData();
            formData.append('name', name);
            formData.append('address', address);
            formData.append('rating', rating + ' из 5');
            formData.append('review', `📝 Новый отзыв с сайта Дока-Тим!\nАвтор: ${name}\nАдрес объекта: ${address}\nОценка: ${rating} из 5\n\nОтзыв:\n${reviewText}`);

            try {
                const endpoint = 'https://formspree.io' + '/f/xlgyyjnj';
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json' },
                    body: formData
                });

                if (response.ok) {
                    form.reset();
                    isDaDataSelected = false;
                    alert('Спасибо! Ваш отзыв успешно отправлен на проверку.');
                } else {
                    alert('Не удалось отправить отзыв. Попробуйте ещё раз.');
                }
            } catch (error) {
                alert('Ошибка сети. Проверьте подключение к интернету.');
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        });
    </script>
</body>

</html>
